<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推移と分類の見本</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1f1e1c;--muted:#6b6a64;--line:#e4e2dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:14px;padding:16px;width:400px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.warn{color:#8a5a00;font-size:12px;margin:0 0 10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.grp{font-size:12px;color:var(--muted);margin:10px 0 2px}
svg text{font-family:inherit}
</style></head><body>
<p class="warn">⚠ どちらの図も、線の途中は形を見せるための仮の数字です。右端の最新の値（日本8月・米国9月）だけが、作った時点で確かめた数字です。</p>

<div class="card"><h2>組み合わせA　総合の推移 ＋ 最新月の分類</h2>
<p class="sub">上で流れを見て、下で今の内訳の差を見る</p>
<div class="legend"><span><i style="background:#2a78d6"></i>日本</span><span><i style="background:#eb6834"></i>米国</span></div>
<div class="grp">総合の推移（前年同月比）</div><div id="a1"></div>
<div class="grp">最新月の分類</div><div id="a2"></div></div>

<div class="card"><h2>組み合わせB　分類ごとの推移を3つ並べる</h2>
<p class="sub">項目ごとに小さな推移の図。目盛りは図ごとに違う</p>
<div class="legend"><span><i style="background:#2a78d6"></i>日本</span><span><i style="background:#eb6834"></i>米国</span></div>
<div id="b"></div></div>

<script>
const NS="http://www.w3.org/2000/svg",JP="#2a78d6",US="#eb6834",MU="#6b6a64";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.append(e);return e};
const txt=(p,x,y,s,o={})=>{const t=el("text",{x,y,"font-size":o.size||12,fill:o.fill||"#1f1e1c","text-anchor":o.anchor||"start","dominant-baseline":"middle"},p);t.textContent=s;return t};
const W=366,R=40;
const M=["25/10","","","26/1","","","26/4","","","26/7","","26/9"];
// 日本は8月まで（9月は未公表）なので11点
const S={
 total:{jp:[3.0,2.9,2.7,2.5,2.4,2.3,2.2,2.1,2.0,2.0,1.9],us:[3.0,2.9,2.8,2.9,3.0,3.1,3.2,3.3,3.3,3.4,3.4,3.7],lo:0,hi:4,ticks:[0,2,4]},
 core:{jp:[2.9,2.8,2.6,2.4,2.3,2.2,2.1,2.0,1.9,1.8,1.7],us:[3.1,3.0,3.0,2.9,2.9,2.8,2.8,2.7,2.7,2.6,2.6,2.6],lo:0,hi:4,ticks:[0,2,4]},
 gas:{jp:[-1,-2,-3,-4,-5,-4,-3,-4,-3,-3,-2.6],us:[-3,-2,0,2,5,9,14,18,22,26,29,34.2],lo:-10,hi:40,ticks:[-10,0,20,40]}
};
function line(host,s,H){
 const svg=el("svg",{width:W,height:H},host);const L=30,B=20;
 const x=i=>L+i/(M.length-1)*(W-L-R),y=v=>6+(s.hi-v)/(s.hi-s.lo)*(H-B-6);
 s.ticks.forEach(t=>{el("line",{x1:L,x2:W-R,y1:y(t),y2:y(t),stroke:t===0?"#bdbbb3":"#eceae4"},svg);txt(svg,L-5,y(t),t+"%",{size:10,fill:MU,anchor:"end"})});
 M.forEach((m,i)=>m&&txt(svg,x(i),H-8,m,{size:10,fill:MU,anchor:"middle"}));
 [[s.jp,JP],[s.us,US]].forEach(([a,c])=>{el("polyline",{points:a.map((v,i)=>x(i)+","+y(v)).join(" "),fill:"none",stroke:c,"stroke-width":2},svg);
  const i=a.length-1;el("circle",{cx:x(i),cy:y(a[i]),r:4,fill:c,stroke:"#fff","stroke-width":1.5},svg);
  txt(svg,x(M.length-1)+6,y(a[i]),a[i]+"%",{size:10,fill:"#1f1e1c"})});
}
line(document.getElementById("a1"),S.total,150);
// A の分類（ダンベル）
{const host=document.getElementById("a2");const rows=[["総合",1.9,3.7,0,4],["生鮮など除く*",1.7,2.6,0,4],["ガソリン",-2.6,34.2,-10,40]];
 const LBL=88,RH=30;const svg=el("svg",{width:W,height:rows.length*RH+6},host);
 rows.forEach(([lab,jp,us,lo,hi],i)=>{const y=i*RH+RH/2;const x=v=>LBL+(v-lo)/(hi-lo)*(W-LBL-R);
  txt(svg,0,y,lab);el("line",{x1:x(0),x2:x(0),y1:y-10,y2:y+10,stroke:"#bdbbb3"},svg);
  el("line",{x1:x(jp),x2:x(us),y1:y,y2:y,stroke:"#c9c7bf","stroke-width":3},svg);
  el("circle",{cx:x(jp),cy:y,r:6,fill:JP,stroke:"#fff","stroke-width":2},svg);el("circle",{cx:x(us),cy:y,r:6,fill:US,stroke:"#fff","stroke-width":2},svg);
  txt(svg,x(us)+9,y,us+"%",{size:10,fill:MU});txt(svg,x(jp)-9,y,jp+"%",{size:10,fill:MU,anchor:"end"});});
 const n=document.createElement("p");n.className="sub";n.style.margin="2px 0 0";n.textContent="ガソリンの行だけ目盛りが -10〜40%";host.append(n);}
// B
[["総合",S.total],["生鮮など除く*",S.core],["ガソリン（目盛りが違います）",S.gas]].forEach(([n,s])=>{const h=document.createElement("div");h.className="grp";h.textContent=n;const b=document.getElementById("b");b.append(h);line(b,s,110)});
</script>
<p class="sub">* 日本は生鮮食品を除く総合、米国は食品とエネルギーを除く総合</p>
</body></html>
