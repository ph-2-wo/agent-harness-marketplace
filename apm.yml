name: agent-harness-marketplace
version: 0.1.0
description: agent のハーネス（skill）を用途別に配る APM Marketplace
author: ph-2-wo
license: MIT
targets:
  - claude
marketplace:
  owner:
    name: ph-2-wo
    url: https://github.com/ph-2-wo

  # Default tag pattern used to resolve version ranges for each package.
  build:
    tagPattern: "v{version}"

  outputs:
    claude: {}

  # 全 package のバージョンを揃える（既定値。明示しておく）
  versioning:
    strategy: lockstep

  packages:
    - name: agent-base-plugin
      source: ./packages/agent-base-plugin
      version: 0.1.0
      description: agent が土台として使う、依存を持たない汎用 skill を提供
    - name: communication-plugin
      source: ./packages/communication-plugin
      version: 0.1.0
      description: ユーザーとのやり取りに使う skill を提供
    - name: review-plugin
      source: ./packages/review-plugin
      version: 0.1.0
      description: 各種 review skill を提供
    - name: dev-workflow-plugin
      source: ./packages/dev-workflow-plugin
      version: 0.1.0
      description: 開発の段階の判定から実装・レビュー依頼までの流れと、検討・設計・指示の管理など、仕事の進め方の skill を提供
    - name: facilitation-plugin
      source: ./packages/facilitation-plugin
      version: 0.1.0
      description: 振り返り会など、人と進める会の進め方の skill を提供
    - name: harness-dev-plugin
      source: ./packages/harness-dev-plugin
      version: 0.1.0
      description: ハーネス（CLAUDE.md・skill・hook）そのものを開発・整備する skill を提供
    - name: pull-request-communication-plugin
      source: ./packages/pull-request-communication-plugin
      version: 0.1.0
      description: commit の切り方と PR の作成など、PR を通したやり取りの skill を提供
    - name: apm-dev-plugin
      source: ./packages/apm-dev-plugin
      version: 0.1.0
      description: APM package/skill 開発用の skill を提供
    - name: next-action-plugin
      source: ./packages/next-action-plugin
      version: 0.1.0
      description: 承認を求める事項・ユーザーへの依頼・後回しを手元の CLI で記録し、未処理を1枚のページに出す skill と、それを前提にした承認の判定の instruction と、CLI のコマンドと未処理の番号をターンごとに差し込み登録の漏れを応答の終わりに確かめる hook を提供
    - name: visualization-plugin
      source: ./packages/visualization-plugin
      version: 0.1.0
      description: 表データ・数値データをグラフィカルに見せる方法のアイデア集の skill を提供
    - name: reply-gate-plugin
      source: ./packages/reply-gate-plugin
      version: 0.1.0
      description: 応答の書き方（長さ・言語）を機械的に確かめて差し戻す hook を提供
    - name: skill-routine-plugin
      source: ./packages/skill-routine-plugin
      version: 0.1.0
      description: skill を使う毎回の手順を注入する hook を提供
    - name: skill-gate-plugin
      source: ./packages/skill-gate-plugin
      version: 0.1.0
      description: 読み込んだ skill をタスクにし、決まった道具の前に skill を読み込ませる hook を提供
    - name: subagent-plugin
      source: ./packages/subagent-plugin
      version: 0.1.0
      description: 組み込みのサブエージェントを上書きする agent 定義を提供
    - name: slack-plugin
      source: ./packages/slack-plugin
      version: 0.1.0
      description: Slack で自分宛てに来たものを時刻で区切って集める skill を提供
